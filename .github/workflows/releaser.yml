name: Releaser

# When version.json changes on main, tag that commit with the version and create a GitHub pre-release whose notes
# are the matching section of CHANGELOG.md. The Upgrade workflow's `verify` action later appends the live
# implementation addresses and, on mainnet, promotes the pre-release to a release. See docs/UPGRADE.md.
on:
  push:
    branches: ["main"]
    paths: ["version.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releaser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(jq -r .version version.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          awk -v tag="$TAG" '
            $0 ~ "^## " { printing = ($2 == tag) ; next }
            printing { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG exists; creating the release on it"
            gh release create "$TAG" --prerelease --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TAG" --notes-file notes.md
          fi
