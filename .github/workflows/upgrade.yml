name: Upgrade

# One step of an SRA/SWA implementation upgrade, run from the Actions tab so the record lives in a workflow run.
# See docs/UPGRADE.md for the sequence. Read-only actions (rehearse, status, verify) need no secrets. Signed
# actions (propose, execute) run in the network's environment, which holds DEPLOYER_PRIVATE_KEY and whose
# required reviewers (with self-review prevented) provide the dispatcher-plus-approver sign-off. Always dispatch
# with the release tag as the ref.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        type: choice
        options:
          - Calibnet
          - Mainnet
      target:
        description: Contract to upgrade
        required: true
        type: choice
        options:
          - sra
          - swa
      action:
        description: Step to run
        required: true
        type: choice
        options:
          - rehearse
          - propose
          - status
          - execute
          - verify
      new_implementation:
        description: New implementation address (required for propose, status and execute; optional for rehearse)
        required: false
        type: string

concurrency:
  group: upgrade-${{ inputs.network }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  readonly:
    if: ${{ inputs.action == 'rehearse' || inputs.action == 'status' || inputs.action == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # verify appends to the release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Select network
        run: |
          case "${{ inputs.network }}" in
            Calibnet) echo "CHAIN_ID=314159" >> "$GITHUB_ENV"; echo "ETH_RPC_URL=https://api.calibration.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
            Mainnet)  echo "CHAIN_ID=314"    >> "$GITHUB_ENV"; echo "ETH_RPC_URL=https://api.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
          esac

      - name: Run ${{ inputs.action }}
        env:
          TARGET: ${{ inputs.target }}
          NEW_IMPLEMENTATION: ${{ inputs.new_implementation }}
        run: |
          set -o pipefail
          case "${{ inputs.action }}" in
            rehearse)
              forge script script/Rehearse.s.sol --rpc-url "$ETH_RPC_URL" 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
            status)
              uv run --quiet tools/upgrade.py "$TARGET" "$NEW_IMPLEMENTATION" status 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
            verify)
              forge script script/Verify.s.sol --rpc-url "$ETH_RPC_URL" 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
          esac

      - name: Record verification in the release
        if: ${{ inputs.action == 'verify' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(jq -r .version version.json)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release $TAG; nothing to record"
            exit 0
          fi
          SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          SRA=$(jq -r ".[\"$CHAIN_ID\"].sra" deployments.json)
          SWA=$(jq -r ".[\"$CHAIN_ID\"].swa" deployments.json)
          SRA_IMPL=$(cast storage "$SRA" "$SLOT" --rpc-url "$ETH_RPC_URL" | sed 's/^0x000000000000000000000000/0x/')
          SWA_IMPL=$(cast storage "$SWA" "$SLOT" --rpc-url "$ETH_RPC_URL" | sed 's/^0x000000000000000000000000/0x/')
          EPOCH=$(cast block-number --rpc-url "$ETH_RPC_URL")
          gh release view "$TAG" --json body -q .body > notes.md
          printf '\n\n**Verified on %s** at epoch %s from `%s` ([run](%s/%s/actions/runs/%s)): SRA implementation `%s`, SWA implementation `%s`.\n' \
            "${{ inputs.network }}" "$EPOCH" "${GITHUB_SHA::8}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$SRA_IMPL" "$SWA_IMPL" >> notes.md
          if [ "${{ inputs.network }}" = "Mainnet" ]; then
            gh release edit "$TAG" --notes-file notes.md --prerelease=false --latest
            echo "promoted $TAG to a release"
          else
            gh release edit "$TAG" --notes-file notes.md
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.action }} ${{ inputs.target }} on ${{ inputs.network }} (\`${GITHUB_SHA::8}\`)"
            echo '```'
            grep -vE '^\s*$|^Compiling|^Solc|^Compiler|^No files' "$RUNNER_TEMP/out.txt" | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  signed:
    if: ${{ inputs.action == 'propose' || inputs.action == 'execute' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'Mainnet' && 'mainnet' || 'calibnet' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Select network
        run: |
          case "${{ inputs.network }}" in
            Calibnet) echo "ETH_RPC_URL=https://api.calibration.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
            Mainnet)  echo "ETH_RPC_URL=https://api.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
          esac

      - name: Run ${{ inputs.action }}
        env:
          # One operations key: it deploys implementations (Deploy Contract), proposes (registered as a proposer
          # on the owner Safes) and executes. It has no power over the contracts.
          PROPOSER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -o pipefail
          test -n "${{ inputs.new_implementation }}" || { echo "new_implementation is required" >&2; exit 1; }
          uv run --quiet tools/upgrade.py "${{ inputs.target }}" "${{ inputs.new_implementation }}" "${{ inputs.action }}" 2>&1 \
            | tee "$RUNNER_TEMP/out.txt"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.action }} ${{ inputs.target }} on ${{ inputs.network }} (\`${GITHUB_SHA::8}\`, by @${{ github.actor }})"
            echo '```'
            grep -vE '^\s*$|^Compiling|^Solc|^Compiler|^No files' "$RUNNER_TEMP/out.txt" | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
