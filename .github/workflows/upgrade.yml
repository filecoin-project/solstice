name: Upgrade

# One step of an SRA/SWA implementation upgrade, run from the Actions tab so the record lives in a workflow run.
# See docs/UPGRADE.md for the sequence. Always dispatch with the release tag as the ref.
#   rehearse, status  read-only, no secrets
#   verify            read-only on chain; appends the result to the GitHub release (contents: write)
#   propose, execute  run in the network's environment, which holds DEPLOYER_PRIVATE_KEY and whose required
#                     reviewers (with self-review prevented) provide the dispatcher-plus-approver sign-off
on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        type: choice
        options:
          - Calibnet
          - Mainnet
      target:
        description: Contract to upgrade
        required: true
        type: choice
        options:
          - sra
          - swa
      action:
        description: Step to run
        required: true
        type: choice
        options:
          - rehearse
          - propose
          - status
          - execute
          - verify
      new_implementation:
        description: New implementation address (required for propose, status and execute; optional for rehearse)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-${{ inputs.network }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.target }}
  NEW_IMPLEMENTATION: ${{ inputs.new_implementation }}
  ACTION: ${{ inputs.action }}

jobs:
  readonly:
    if: ${{ inputs.action == 'rehearse' || inputs.action == 'status' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        run: |
          set -o pipefail
          case "$ACTION" in
            rehearse)
              forge script script/Rehearse.s.sol --rpc-url "$ETH_RPC_URL" 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
            status)
              [[ "$NEW_IMPLEMENTATION" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "new_implementation must be a 0x address" >&2; exit 1; }
              uv run --quiet --locked tools/upgrade.py "$TARGET" "$NEW_IMPLEMENTATION" status 2>&1 | tee "$RUNNER_TEMP/out.txt" ;;
          esac
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.action }} ${{ inputs.target }} on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  verify:
    if: ${{ inputs.action == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # appends the result to the release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        run: |
          set -o pipefail
          forge script script/Verify.s.sol --rpc-url "$ETH_RPC_URL" 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - name: Record verification in the release
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          # This job is not behind the environment reviewers, so it edits the release only for commits on main.
          git fetch --quiet --depth=200 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main; not touching the release"
            exit 1
          fi
          TAG=$(jq -r .version version.json)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release $TAG; nothing to record"
            exit 0
          fi
          SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          SRA=$(jq -r ".[\"$CHAIN_ID\"].sra" deployments.json)
          SWA=$(jq -r ".[\"$CHAIN_ID\"].swa" deployments.json)
          SRA_IMPL=$(cast storage "$SRA" "$SLOT" --rpc-url "$ETH_RPC_URL" | sed 's/^0x000000000000000000000000/0x/')
          SWA_IMPL=$(cast storage "$SWA" "$SLOT" --rpc-url "$ETH_RPC_URL" | sed 's/^0x000000000000000000000000/0x/')
          EPOCH=$(cast block-number --rpc-url "$ETH_RPC_URL")
          gh release view "$TAG" --json body -q .body > notes.md
          printf '\n\n**Verified on %s** at epoch %s from `%s` ([run](%s/%s/actions/runs/%s)): SRA implementation `%s`, SWA implementation `%s`.\n' \
            "$NETWORK" "$EPOCH" "${GITHUB_SHA::8}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$SRA_IMPL" "$SWA_IMPL" >> notes.md
          if [ "$NETWORK" = "Mainnet" ]; then
            gh release edit "$TAG" --notes-file notes.md --prerelease=false --latest
            echo "promoted $TAG to a release"
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "verify on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  signed:
    if: ${{ inputs.action == 'propose' || inputs.action == 'execute' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'Mainnet' && 'mainnet' || 'calibnet' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        env:
          # One operations key: it deploys implementations (Deploy Contract), proposes (registered as a proposer
          # on the owner Safes) and executes. It has no power over the contracts.
          PROPOSER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -o pipefail
          [[ "$NEW_IMPLEMENTATION" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "new_implementation must be a 0x address" >&2; exit 1; }
          uv run --quiet --locked tools/upgrade.py "$TARGET" "$NEW_IMPLEMENTATION" "$ACTION" 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.action }} ${{ inputs.target }} on ${{ inputs.network }} (${{ github.sha }}, by ${{ github.actor }})"
          log: ${{ runner.temp }}/out.txt
