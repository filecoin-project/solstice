name: Upgrade
# GitHub does not show dispatch inputs on a run, so reviewers approving the environment cannot see them; put them in the title.
run-name: "${{ inputs.operation }} on ${{ inputs.network }} at ${{ github.ref_name }}${{ inputs.sra_implementation && format(' (SRA {0}, SWA {1})', inputs.sra_implementation, inputs.swa_implementation) || '' }} by ${{ github.actor }}"

# One step of an SRA/SWA implementation upgrade, dispatched with the release tag as the ref so the record lives
# in a run. Each job is a thin wrapper around tools/upgrade.py; docs/UPGRADE.md has the sequence.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        required: true
        type: choice
        options:
          - Calibnet
          - Mainnet
      operation:
        description: Step to run (see docs/UPGRADE.md)
        required: true
        type: choice
        options:
          - rehearse
          - propose
          - status
          - execute
          - verify
          - check-setup
      sra_implementation:
        description: New SRA implementation address (propose, status, execute; optional for check-setup)
        required: false
        type: string
      swa_implementation:
        description: New SWA implementation address (propose, status, execute; optional for check-setup)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upgrade-${{ inputs.network }}
  cancel-in-progress: false

env:
  OPERATION: ${{ inputs.operation }}
  SRA: ${{ inputs.sra_implementation }}
  SWA: ${{ inputs.swa_implementation }}
  NETWORK_NAME: ${{ inputs.network }}
  # The operations key's public address, a repo variable so ungated jobs can read it: check-setup reports on it,
  # and every job that uses DEPLOYER_PRIVATE_KEY stops if the key does not match it.
  DEPLOYER_ADDRESS: ${{ vars.DEPLOYER_ADDRESS }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  readonly:
    if: ${{ inputs.operation == 'rehearse' || inputs.operation == 'status' || inputs.operation == 'check-setup' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        run: |
          set -o pipefail
          if [ "$OPERATION" = rehearse ]; then
            uv run --quiet --locked tools/upgrade.py rehearse 2>&1 | tee "$RUNNER_TEMP/out.txt"
          else
            uv run --quiet --locked tools/upgrade.py "$OPERATION" --sra "$SRA" --swa "$SWA" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          fi
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.operation }} on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  verify:
    if: ${{ inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # appends the result to the release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Record into the release only when dispatched at a tag; the tool checks the tag points at this commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run --quiet --locked tools/upgrade.py verify --record-release "$GITHUB_REF_NAME" 2>&1 | tee "$RUNNER_TEMP/out.txt"
          else
            uv run --quiet --locked tools/upgrade.py verify 2>&1 | tee "$RUNNER_TEMP/out.txt"
          fi
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "verify on ${{ inputs.network }} (${{ github.sha }})"
          log: ${{ runner.temp }}/out.txt

  # Shows the reviewer what they are approving and checks it, before `signed` asks for approval.
  pregate:
    if: ${{ inputs.operation == 'propose' || inputs.operation == 'execute' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - uses: ./.github/actions/pregate
        with:
          title: ${{ inputs.operation }} on ${{ inputs.network }}
          sra: ${{ inputs.sra_implementation }}
          swa: ${{ inputs.swa_implementation }}
          require_addresses: true
          # Owners and proposer registration matter to propose, not to execute (the owners have already approved).
          check_setup: ${{ inputs.operation == 'propose' }}

  signed:
    if: ${{ inputs.operation == 'propose' || inputs.operation == 'execute' }}
    needs: pregate
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'Mainnet' && 'mainnet' || 'calibnet' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
        with:
          network: ${{ inputs.network }}
      - name: Run
        env:
          # The operations key: it deploys implementations (Deploy Contract), proposes (registered as a proposer
          # on the owner Safes) and executes. It has no power over the contracts.
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          set -o pipefail
          uv run --quiet --locked tools/upgrade.py "$OPERATION" --sra "$SRA" --swa "$SWA" 2>&1 | tee "$RUNNER_TEMP/out.txt"
      - uses: ./.github/actions/summary
        if: always()
        with:
          title: "${{ inputs.operation }} on ${{ inputs.network }} (${{ github.sha }}, by ${{ github.actor }})"
          log: ${{ runner.temp }}/out.txt
