name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Shallow-clone EVM assembler
        run: git clone --depth 1 --revision ec310007c7915ffee5043340d1211095aae07597 --recurse-submodules --shallow-submodules --no-tags https://github.com/wjmelements/evm.git

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build EVM assembler
        run: make -C evm bin/evm

      - name: Install EVM assembler
        run: sudo install $(pwd)/evm/bin/evm $(dirname $(which git))/evm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: true

      - name: Install Dependencies
        run: |
          forge install

      - name: Run tests
        run: |
          make test
        env:
          FOUNDRY_PROFILE: ci
