name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # dio (evm assembler's fork tests) fetches mainnet state over JSON-RPC.
      # Use a keyed endpoint when available; fall back to a public one for fork PRs.
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL || 'https://eth.llamarpc.com' }}

    steps:
      - uses: actions/checkout@v7

      - name: Shallow-clone EVM assembler
        run: git clone --depth 1 --revision 315d16a2f2f6d5a3a23811cd1fdb53640c273636 --recurse-submodules --shallow-submodules --no-tags https://github.com/wjmelements/evm.git

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build EVM assembler
        run: make -C evm check

      - name: Install EVM assembler
        run: sudo install $(pwd)/evm/bin/evm $(dirname $(which git))/evm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: true

      - name: Install Dependencies
        run: |
          forge install

      - name: Run tests
        run: |
          make test
        env:
          FOUNDRY_PROFILE: ci
