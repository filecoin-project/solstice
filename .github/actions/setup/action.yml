name: Solstice toolchain
description: Install Foundry and uv, and export ETH_RPC_URL and CHAIN_ID for the chosen network.
inputs:
  network:
    description: Calibnet or Mainnet
    required: true
runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.7.1
        cache: true

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Select network
      shell: bash
      env:
        NETWORK: ${{ inputs.network }}
      run: |
        case "$NETWORK" in
          Calibnet) echo "CHAIN_ID=314159" >> "$GITHUB_ENV"; echo "ETH_RPC_URL=https://api.calibration.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
          Mainnet)  echo "CHAIN_ID=314"    >> "$GITHUB_ENV"; echo "ETH_RPC_URL=https://api.node.glif.io/rpc/v1" >> "$GITHUB_ENV" ;;
          *) echo "unknown network: $NETWORK" >&2; exit 1 ;;
        esac
