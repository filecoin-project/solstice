# Why this exists: GitHub does not show workflow_dispatch inputs anywhere on a run, including:
# 1. run page
# 2. "Review deployments" dialog an environment approver uses
# 3. the REST API
# These are key inputs for a reviewer to see.
# This shortcoming was confirmed in:
# - Feature request open since 2023-03, unanswered by GitHub, 230+ upvotes:
#   https://github.com/orgs/community/discussions/49648 (its workarounds: inputs in run-name, or in the job summary)
# - The approver's steps list only choosing the environments and an optional comment:
#   https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/review-deployments
# - The same workaround for environment approvals, a job summary written before the gated job:
#   https://nakamasato.medium.com/how-to-review-github-actions-dispatch-workflows-inputs-with-environment-protection-f981428e3514
# - The REST record of a check-setup dispatch on Calibnet has no input values, only `"display_title": "Upgrade"`:
#   [example run](https://github.com/filecoin-project/solstice/actions/runs/37023481678)
name: Pre-gate summary
description: >-
  Run in a job without an environment that the gated job `needs`, so the reviewer sees this summary on the run page
  before approving (GitHub shows dispatch inputs nowhere else; see the comment above). A thin wrapper around
  `tools/upgrade.py pregate`, which checks the ref and any addresses, and optionally `tools/upgrade.py check-setup`;
  either fails the job before the approval request. Needs a checkout with full history and the setup action for the network.
inputs:
  title:
    description: What is being approved, e.g. "propose on Calibnet"
    required: true
  sra:
    description: SRA implementation address, checked to have code on chain
    required: false
    default: ""
  swa:
    description: SWA implementation address, checked to have code on chain
    required: false
    default: ""
  require_addresses:
    description: Whether a missing address fails; if not, it is left out
    required: false
    default: "false"
  check_setup:
    description: >-
      Whether to also run `tools/upgrade.py check-setup` (owners on the proxies, DEPLOYER_ADDRESS as proposer). Not for
      execute, which needs neither (the owners have already approved) and should not be blocked by, say, an owner
      replaced during the hold; not for a full deployment, whose proxies do not exist yet.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TITLE: ${{ inputs.title }}
        SRA: ${{ inputs.sra }}
        SWA: ${{ inputs.swa }}
        REQUIRE: ${{ inputs.require_addresses }}
      run: |
        args=(pregate --title "$TITLE" --sra "$SRA" --swa "$SWA")
        if [ "$REQUIRE" = true ]; then args+=(--require-addresses); fi
        uv run --quiet --locked tools/upgrade.py "${args[@]}"
    # Runs even if a check above failed, to show the whole picture; its output goes in the summary.
    - if: ${{ always() && inputs.check_setup == 'true' }}
      shell: bash
      env:
        SRA: ${{ inputs.sra }}
        SWA: ${{ inputs.swa }}
      run: |
        status=0
        uv run --quiet --locked tools/upgrade.py check-setup --sra "$SRA" --swa "$SWA" > "$RUNNER_TEMP/check-setup.txt" 2>&1 || status=$?
        cat "$RUNNER_TEMP/check-setup.txt"
        { echo "## check-setup"; echo; cat "$RUNNER_TEMP/check-setup.txt"; } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
