[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.36"
via_ir = false
optimizer = true
optimizer_runs = 2000
bytecode_hash = "none"
cbor_metadata = false

# For dependencies
remappings = [
    'forge-std/=lib/forge-std/src/',
    'fvm-solidity/=lib/fvm-solidity/src/',
    'erc8167/=lib/erc8167/src/',
]

fs_permissions = [
    { access = "read", path = "./out/" },
    { access = "read", path = "./lib/erc8167/out/" },
    { access = "read", path = "./lib/ReservedAddress/" },
]

# Fast invariant campaign for local iteration; CI overrides with FOUNDRY_PROFILE=ci.
[profile.default.invariant]
runs = 16
depth = 64

[profile.ci.invariant]
runs = 256
depth = 500

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    "boolean-cst", # false-positives on return values
    "calls-loop", # false-positives on new[]
    "controlled-delegatecall", # false-positives on child contracts
    "cyclomatic-complexity",
    "divide-before-multiply", # intentional for testing
    "function-init-state",  # false-positives on makeAddr
    "internal-function-used-once",
    "incorrect-modifier", # intentional
    "incorrect-shift",
    "inline-assembly", # solc is incompetent
    "literal-instead-of-constant", # false-positives in testing
    "low-level-calls", # false-positives on functions also called call
    "mapping-deletion", # we know delete doesn't recurse into mappings
    "missing-events-access-control", # false-positives in mocks
    "missing-zero-check", # false-positives in testing
    "mixed-case-function",
    "multi-contract-file",
    "reentrancy-no-eth", # false-positives in testing
    "reentrancy-events", # false-positives on vm.expectEmit
    "require-revert-in-loop", # intentional
    "too-many-digits", # false-positives on autogenerated code
    "uninitialized-local", # uninitialized is implicitly zero in solidity
    "unchecked-call", # false-positive when function is called call
    "unsafe-typecast",
    "unused-return", # false-positives in testing
    "unwrapped-modifier-logic",
]
